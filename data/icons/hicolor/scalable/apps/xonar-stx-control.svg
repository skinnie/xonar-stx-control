<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Card body gradient -->
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2d3d"/>
      <stop offset="100%" stop-color="#1a1a2a"/>
    </linearGradient>
    <!-- Gold accent for PCB traces / audiophile feel -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0c040"/>
      <stop offset="100%" stop-color="#c89828"/>
    </linearGradient>
    <!-- Accent glow -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8364f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e8364f" stop-opacity="0"/>
    </radialGradient>
    <!-- DAC chip gradient -->
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a4f"/>
      <stop offset="100%" stop-color="#252535"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded PCB card shape -->
  <rect x="8" y="14" width="112" height="100" rx="12" ry="12"
        fill="url(#card-bg)" stroke="#444460" stroke-width="1.5"/>

  <!-- PCB trace lines (gold, subtle) -->
  <g stroke="url(#gold)" stroke-width="1.2" fill="none" opacity="0.35">
    <line x1="20" y1="30" x2="50" y2="30"/>
    <line x1="50" y1="30" x2="50" y2="45"/>
    <line x1="20" y1="98" x2="45" y2="98"/>
    <line x1="45" y1="98" x2="45" y2="85"/>
    <line x1="78" y1="98" x2="108" y2="98"/>
    <line x1="78" y1="98" x2="78" y2="85"/>
    <line x1="80" y1="30" x2="108" y2="30"/>
    <line x1="80" y1="30" x2="80" y2="45"/>
  </g>

  <!-- DAC chip (center) -->
  <rect x="40" y="45" width="48" height="30" rx="3" ry="3"
        fill="url(#chip)" stroke="#555570" stroke-width="1"/>

  <!-- Chip pins (left side) -->
  <g stroke="#888898" stroke-width="1.5" stroke-linecap="round">
    <line x1="35" y1="51" x2="40" y2="51"/>
    <line x1="35" y1="56" x2="40" y2="56"/>
    <line x1="35" y1="61" x2="40" y2="61"/>
    <line x1="35" y1="66" x2="40" y2="66"/>
    <!-- Right side -->
    <line x1="88" y1="51" x2="93" y2="51"/>
    <line x1="88" y1="56" x2="93" y2="56"/>
    <line x1="88" y1="61" x2="93" y2="61"/>
    <line x1="88" y1="66" x2="93" y2="66"/>
    <!-- Top -->
    <line x1="51" y1="40" x2="51" y2="45"/>
    <line x1="57" y1="40" x2="57" y2="45"/>
    <line x1="64" y1="40" x2="64" y2="45"/>
    <line x1="70" y1="40" x2="70" y2="45"/>
    <!-- Bottom -->
    <line x1="51" y1="75" x2="51" y2="80"/>
    <line x1="57" y1="75" x2="57" y2="80"/>
    <line x1="64" y1="75" x2="64" y2="80"/>
    <line x1="70" y1="75" x2="70" y2="80"/>
  </g>

  <!-- Chip label: "STX" -->
  <text x="64" y="63" text-anchor="middle" font-family="monospace"
        font-size="11" font-weight="bold" fill="#c0c0d8" letter-spacing="2">
    STX
  </text>

  <!-- Headphone arc (top, overlapping card edge) -->
  <path d="M 38 22 C 38 4, 90 4, 90 22"
        fill="none" stroke="url(#gold)" stroke-width="3.5"
        stroke-linecap="round"/>

  <!-- Left ear cup -->
  <rect x="30" y="18" width="14" height="20" rx="5" ry="5"
        fill="#2a2a3a" stroke="url(#gold)" stroke-width="2"/>

  <!-- Right ear cup -->
  <rect x="84" y="18" width="14" height="20" rx="5" ry="5"
        fill="#2a2a3a" stroke="url(#gold)" stroke-width="2"/>

  <!-- Sound wave arcs (right side, from chip output) -->
  <g stroke="#e8364f" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M 97 55 C 102 50, 102 66, 97 61" stroke-width="2"/>
    <path d="M 102 51 C 109 45, 109 71, 102 65" stroke-width="1.8" opacity="0.6"/>
    <path d="M 107 48 C 115 40, 115 76, 107 68" stroke-width="1.5" opacity="0.35"/>
  </g>

  <!-- Accent LED dot (on card, bottom-left) -->
  <circle cx="24" cy="88" r="3.5" fill="#e8364f" opacity="0.9"/>
  <circle cx="24" cy="88" r="6" fill="url(#glow)"/>

  <!-- PCI bracket notch (bottom edge detail) -->
  <rect x="54" y="110" width="20" height="4" rx="1" ry="1"
        fill="#444460"/>
</svg>

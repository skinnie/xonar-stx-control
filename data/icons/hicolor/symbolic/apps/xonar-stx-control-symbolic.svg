<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Symbolic icon for panel/tray use. Single color, follows system fg. -->
  <g fill="currentColor">
    <!-- Headphone arc -->
    <path d="M 3.5 6 C 3.5 2.5, 12.5 2.5, 12.5 6" fill="none"
          stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Left cup -->
    <rect x="2" y="5.5" width="3" height="4" rx="1"/>
    <!-- Right cup -->
    <rect x="11" y="5.5" width="3" height="4" rx="1"/>
    <!-- Card body -->
    <rect x="4" y="10" width="8" height="4.5" rx="1" opacity="0.7"/>
    <!-- Chip dot -->
    <rect x="6.5" y="11.5" width="3" height="1.8" rx="0.5"/>
  </g>
</svg>
